<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- SaathApp Icon Favicon -->
  <defs>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Green gradient background with rounded corners -->
  <rect width="100" height="100" rx="20" fill="url(#greenGradient)"/>
  
  <!-- Shopping Bag -->
  <g transform="translate(30, 25)">
    <!-- Bag body -->
    <path d="M 5 5 L 5 30 Q 5 35 10 35 L 35 35 Q 40 35 40 30 L 40 5 Q 40 0 35 0 L 10 0 Q 5 0 5 5 Z" 
          fill="white" stroke="white" stroke-width="1" stroke-linejoin="round"/>
    
    <!-- Bag handle -->
    <path d="M 10 0 Q 10 -8 22.5 -8 Q 35 -8 35 0" 
          fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Highlight/shine effect -->
    <circle cx="22.5" cy="15" r="2" fill="#22c55e" opacity="0.4"/>
  </g>
</svg>
