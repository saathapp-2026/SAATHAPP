<svg width="280" height="70" viewBox="0 0 280 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shop Storefront + Handshake + Growth Arrow Icon -->
  <g transform="translate(170, 4)">
    <!-- Shop Storefront -->
    <path d="M0 22 L26 22 L26 48 L0 48 Z" fill="#16A34A"/>
    <path d="M-3 15 L29 15 L26 22 L0 22 Z" fill="#15803D"/>
    <rect x="9" y="31" width="8" height="17" fill="#FFFFFF"/>
    <rect x="4" y="24" width="7" height="5" fill="#FFFFFF"/>
    <rect x="15" y="24" width="7" height="5" fill="#FFFFFF"/>
    <!-- Handshake -->
    <path d="M28 28 C30 25, 36 25, 39 28 L44 33 L39 38 L34 33 Z" fill="#16A34A"/>
    <path d="M33 33 C36 30, 42 30, 45 33 L50 38 L45 43 Z" fill="#22C55E"/>
    <!-- Growth Chart -->
    <rect x="52" y="32" width="6" height="16" rx="1.5" fill="#16A34A"/>
    <rect x="61" y="23" width="6" height="25" rx="1.5" fill="#16A34A"/>
    <rect x="70" y="14" width="6" height="34" rx="1.5" fill="#22C55E"/>
    <!-- Upward Growth Arrow -->
    <path d="M50 24 L74 4 M74 4 H63 M74 4 V15" stroke="#16A34A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Text -->
  <text x="0" y="38" font-family="'Sora', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="-0.5">saath<tspan fill="#16A34A">Franchise</tspan></text>

  <!-- Tagline -->
  <line x1="8" y1="52" x2="28" y2="52" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
  <text x="34" y="55" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#1E293B" letter-spacing="0.2">Grow Together. Succeed Together.</text>
  <line x1="210" y1="52" x2="230" y2="52" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
